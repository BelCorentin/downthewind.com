<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>downthewind</title>
<meta name="description" content="Downwind wingfoil & SUP-foil runs in France — interactive map, exits, train stations, live local knowledge and AROME forecasts.">
<meta name="theme-color" content="#070b11">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">

  <aside id="aside">
    <button class="sheet-handle" id="sheetHandle" aria-label="expand"></button>
    <div class="topbar">
      <div class="brand">
        <h1 id="brand">down<b>the</b>wind</h1>
        <div class="tag" id="tagline"></div>
      </div>
      <div class="langtoggle">
        <button data-lang="fr">FR</button><button data-lang="en">EN</button>
      </div>
    </div>
    <div class="aside-body">
      <button class="backBtn" id="backBtn" style="display:none"></button>
      <div id="panel"></div>
    </div>
  </aside>

  <div id="mapwrap">
    <div id="map"></div>
    <canvas id="heatCanvas"></canvas>
    <canvas id="overlayCanvas"></canvas>

    <div id="layerCtl">
      <button id="btnWind" onclick="setMode('wind')">💨</button>
      <button id="btnWaves" onclick="setMode('waves')">🌊</button>
    </div>

    <div id="profileWrap">
      <svg id="profile" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>

    <div id="timeCtl" class="glass">
      <button id="playBtn" onclick="togglePlay()">▶</button>
      <div class="track">
        <input type="range" id="timeSlider" min="0" max="95" value="0" aria-label="forecast hour">
        <div id="dayTicks"></div>
      </div>
      <span id="timeLbl"></span>
    </div>

    <div id="ovLegend" class="glass">
      <div id="ovLegendTitle"></div>
      <div class="bar" id="ovLegendBar"></div>
      <div class="ends"><span id="legLo"></span><span id="legHi"></span></div>
    </div>

    <footer class="credit">
      tiles © <a href="https://carto.com/attributions">CARTO</a> ·
      © <a href="https://www.openstreetmap.org/copyright">OSM</a> ·
      © <a href="https://open-meteo.com">Open-Meteo</a>
    </footer>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/i18n.js"></script>
<script src="js/geo.js"></script>
<script src="data/regions.js"></script>
<script src="data/nodes.js"></script>
<script src="data/zones.js"></script>
<script src="data/runs.js"></script>
<script src="js/forecast.js"></script>
<script src="js/rules.js"></script>
<script src="js/map.js"></script>
<script src="js/profile.js"></script>
<script src="js/reports.js"></script>
<script src="js/ui.js"></script>
<script>boot();</script>
</body>
</html>
